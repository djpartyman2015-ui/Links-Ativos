<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caderno de Vocabulário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --paper:#F6F2E9;
    --ink:#20303A;
    --gold:#B8862A;
    --sage:#5E7A63;
    --card-border:#DAD0B8;
    --error:#B4432F;
    --paper-shadow: rgba(32,48,58,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(32,48,58,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--sage);margin-bottom:6px;}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:38px;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:#5B6A72;font-size:14.5px;}

  .authbox{display:flex;align-items:center;gap:10px;}
  .userchip{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sage);}
  .userchip img{width:26px;height:26px;border-radius:50%;}
  .signout,.signin{border:1px solid var(--card-border);background:#fff;border-radius:6px;padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;}
  .signin{background:var(--ink);color:var(--paper);border:none;}
  .signin:hover{opacity:.85;}
  .signout:hover{border-color:var(--error);color:var(--error);}

  .gate{text-align:center;padding:80px 20px;font-family:'Fraunces',serif;font-size:18px;color:#5B6A72;}
  .gate button{margin-top:18px;}

  form{display:flex;gap:10px;margin:26px 0 8px;background:#fff;border:1px solid var(--card-border);padding:14px;border-radius:10px;box-shadow:0 2px 0 var(--paper-shadow);}
  input[type=text]{flex:1;border:none;outline:none;font-family:'Fraunces',serif;font-size:20px;background:transparent;color:var(--ink);}
  input[type=text]::placeholder{color:#B7AE99;}
  button.add{background:var(--ink);color:var(--paper);border:none;border-radius:6px;padding:0 20px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:opacity .15s;}
  button.add:hover{opacity:.85;}
  button.add:disabled{opacity:.5;cursor:default;}

  .status{font-family:'JetBrains Mono',monospace;font-size:12.5px;min-height:18px;margin:6px 2px 22px;}
  .status.err{color:var(--error);}
  .status.ok{color:var(--sage);}

  .count{font-family:'JetBrains Mono',monospace;font-size:12px;color:#8A8065;letter-spacing:.06em;text-transform:uppercase;margin:0 0 14px 2px;}

  .card{background:#fff;border:1px solid var(--card-border);border-radius:10px;padding:20px 22px;margin-bottom:16px;position:relative;box-shadow:0 2px 0 var(--paper-shadow);animation:file-in .35s ease;}
  @keyframes file-in{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}
  .card::before{content:"";position:absolute;top:0; left:22px; right:22px;height:1px;background-image:linear-gradient(to right, var(--card-border) 60%, transparent 0%);background-size:8px 1px;background-repeat:repeat-x;}
  .row1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .word{font-family:'Fraunces',serif;font-weight:700;font-size:26px;}
  .phonetic{font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--gold);}
  .speak{margin-left:auto;border:1px solid var(--card-border);background:var(--paper);border-radius:20px;width:34px;height:34px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .speak:hover{background:#fff;border-color:var(--gold);}
  .translation{font-size:18px;color:var(--sage);font-weight:600;margin:6px 0 10px;}
  .definition{font-size:14.5px;color:#3E4B52;margin-bottom:8px;line-height:1.5;}
  .example{font-size:14px;font-style:italic;color:#5B6A72;border-left:2px solid var(--card-border);padding-left:10px;line-height:1.5;}
  .example .pt{display:block;font-style:normal;font-family:'JetBrains Mono',monospace;font-size:12px;color:#8A8065;margin-top:4px;}
  .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:#B7AE99;margin-top:12px;display:flex;justify-content:space-between;align-items:center;}
  .del{background:none;border:none;color:#B7AE99;cursor:pointer;font-size:11px;font-family:'JetBrains Mono',monospace;text-decoration:underline;}
  .del:hover{color:var(--error);}
  .empty{text-align:center;padding:60px 20px;color:#8A8065;font-family:'Fraunces',serif;font-size:17px;}
  .hidden{display:none !important;}
  .refresh{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8065;
    background:none;border:1px solid var(--card-border);border-radius:6px;
    cursor:pointer;letter-spacing:.04em;padding:8px 10px;
  }
  .refresh:hover{color:var(--sage);border-color:var(--sage);background:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Caderno pessoal · Inglês → Português</div>
      <h1>Vocabulário</h1>
      <div class="sub">Adicione uma palavra nova que você aprendeu. Eu busco o significado, traduzo e monto um exemplo.</div>
    </div>
    <div class="authbox" id="authbox"></div>
  </header>

  <div id="gate" class="gate hidden">
    Entre com sua conta Google pra acessar seu caderno.<br>
    <button class="signin" id="signinBtn2">Entrar com Google</button>
  </div>

  <div id="app" class="hidden">
    <form id="form">
      <input type="text" id="wordInput" placeholder="ex: resilient" autocomplete="off">
      <button class="add" type="submit" id="addBtn">Adicionar</button>
    </form>
    <div class="status" id="status"></div>
    <div class="count" id="count">
      <span id="countText"></span>
      <button class="refresh" id="regenAllBtn" style="margin-left:10px;font-size:10px;" title="Buscar frases reais para todas as palavras já salvas">🔄 atualizar todas as frases</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBnU7bTrKb2jQT64aifNvuF74GJBBQzOMI",
  authDomain: "medicos-andrey.firebaseapp.com",
  databaseURL: "https://medicos-andrey-default-rtdb.firebaseio.com",
  projectId: "medicos-andrey",
  storageBucket: "medicos-andrey.firebasestorage.app",
  messagingSenderId: "450997342841",
  appId: "1:450997342841:web:682e3ec4e40f0f32e7faa8"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const DB = firebaseConfig.databaseURL;
const NODE = "vocab_words"; // nó próprio, isolado dos dados de médicos
const MW_KEY = "7583525a-9fd9-4c24-9d53-8ac97da4485e"; // Merriam-Webster Collegiate Dictionary

let idToken = null;
let words = []; // {key, word, phonetic, translation, definition, example, examplePt, date}

const authbox = document.getElementById('authbox');
const gate = document.getElementById('gate');
const appEl = document.getElementById('app');
const form = document.getElementById('form');
const input = document.getElementById('wordInput');
const addBtn = document.getElementById('addBtn');
const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
document.getElementById('regenAllBtn').addEventListener('click', regenerateAllExamples);

function setStatus(msg, isErr){
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (isErr ? ' err' : msg ? ' ok' : '');
}

function signIn(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e => setStatus('Falha no login: ' + e.message, true));
}
function signOutUser(){ auth.signOut(); }
document.getElementById('signinBtn2').addEventListener('click', signIn);

auth.onAuthStateChanged(async (user) => {
  if(user){
    idToken = await user.getIdToken();
    gate.classList.add('hidden');
    appEl.classList.remove('hidden');
    authbox.innerHTML = `
      <div class="userchip">
        ${user.photoURL ? `<img src="${user.photoURL}">` : ''}
        ${user.displayName || user.email || ''}
      </div>
      <button class="signout" id="signoutBtn">Sair</button>
      <button class="refresh" id="refreshBtn" title="Forçar atualização (limpa cache)">↻</button>
    `;
    document.getElementById('signoutBtn').addEventListener('click', signOutUser);
    document.getElementById('refreshBtn').addEventListener('click', () => {
      const url = new URL(window.location.href);
      url.searchParams.set('_r', Date.now());
      window.location.href = url.toString();
    });
    await loadWords();
  }else{
    idToken = null;
    appEl.classList.add('hidden');
    gate.classList.remove('hidden');
    authbox.innerHTML = '';
  }
});

async function freshToken(){
  idToken = await auth.currentUser.getIdToken(true);
  return idToken;
}

async function loadWords(){
  try{
    const r = await fetch(`${DB}/${NODE}.json?auth=${idToken}`);
    const data = await r.json();
    if(!r.ok || (data && data.error)){
      throw new Error((data && data.error) || ('HTTP ' + r.status));
    }
    words = data ? Object.entries(data).map(([key, v]) => ({key, ...v})) : [];
    words.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  }catch(e){
    console.error('loadWords failed:', e);
    setStatus('Não consegui carregar seu caderno (' + e.message + ').', true);
    words = [];
  }
  render();
}

let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text){
  if(!('speechSynthesis' in window)){
    setStatus('Seu navegador não suporta leitura de voz.', true);
    return;
  }
  const synth = window.speechSynthesis;
  const fire = () => {
    synth.resume();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    const enVoice = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang && v.lang.startsWith('en'));
    if(enVoice) u.voice = enVoice;
    u.onstart = () => setStatus('🔊 ' + text);
    u.onend = () => setStatus('');
    u.onerror = (e) => {
      if(e.error === 'interrupted') return;
      console.error('speech error:', e.error);
      setStatus('Não consegui tocar o áudio (' + e.error + '). Confira se o som do navegador está ligado.', true);
    };
    synth.speak(u);
  };
  if(synth.speaking || synth.pending){
    synth.cancel();
    setTimeout(fire, 80);
  }else{
    fire();
  }
}

async function translate(text){
  try{
    const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=en|pt-BR');
    const d = await r.json();
    return d?.responseData?.translatedText || '';
  }catch(e){ return ''; }
}

function stripMwMarkup(text){
  return String(text || '')
    .replace(/\{bc\}/g, ': ')
    .replace(/\{(wi|it|phrase|b|inf|sup|sc)\}/g, '')
    .replace(/\{\/(wi|it|phrase|b|inf|sup|sc)\}/g, '')
    .replace(/\{sx\|([^|}]+)\|[^}]*\}/g, '$1')
    .replace(/\{a_link\|([^}]+)\}/g, '$1')
    .replace(/\{d_link\|([^|}]+)\|[^}]*\}/g, '$1')
    .replace(/\{dx[^}]*\}/g, '')
    .replace(/\{[^}]*\}/g, '')
    .trim();
}

function findFirstMwExample(node){
  if(Array.isArray(node)){
    if(node.length === 2 && node[0] === 'vis' && Array.isArray(node[1])){
      for(const item of node[1]){
        if(item && item.t) return stripMwMarkup(item.t);
      }
    }
    for(const child of node){
      const found = findFirstMwExample(child);
      if(found) return found;
    }
  }else if(node && typeof node === 'object'){
    for(const key in node){
      const found = findFirstMwExample(node[key]);
      if(found) return found;
    }
  }
  return null;
}

async function fetchFromMerriamWebster(word){
  try{
    const r = await fetch('https://www.dictionaryapi.com/api/v3/references/collegiate/json/' + encodeURIComponent(word) + '?key=' + MW_KEY);
    if(!r.ok) return null;
    const data = await r.json();
    if(!Array.isArray(data) || !data.length || typeof data[0] === 'string') return null; // sem match exato (só sugestões)
    const entry = data.find(e => e && e.meta && e.meta.id && e.meta.id.split(':')[0].toLowerCase() === word.toLowerCase()) || data[0];
    if(!entry || typeof entry !== 'object' || !entry.shortdef || !entry.shortdef.length) return null;
    const definition = entry.shortdef[0];
    const mwPr = entry.hwi && entry.hwi.prs && entry.hwi.prs[0] && entry.hwi.prs[0].mw;
    const phonetic = mwPr ? '/' + mwPr + '/' : '';
    const example = findFirstMwExample(entry.def) || '';
    const cleanWord = (entry.meta && entry.meta.id) ? entry.meta.id.split(':')[0] : word;
    return { word: cleanWord, phonetic, definition, example };
  }catch(e){
    console.error('merriam-webster failed:', e);
    return null;
  }
}

async function parseDictionaryApiResponse(r, word){
  if(!r.ok) return null;
  const data = await r.json();
  const entry = data[0];
  const phonetic = entry.phonetic || (entry.phonetics || []).map(p=>p.text).find(Boolean) || '';
  let definition = '', example = '';
  for(const m of entry.meanings || []){
    for(const d of m.definitions || []){
      if(!definition) definition = d.definition;
      if(!example && d.example) example = d.example;
      if(definition && example) break;
    }
    if(definition && example) break;
  }
  return { word: entry.word || word, phonetic, definition, example };
}

async function fetchFromDictionaryApi(word){
  const directUrl = 'https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word);
  // 1ª tentativa: direto
  try{
    const r = await fetch(directUrl);
    const parsed = await parseDictionaryApiResponse(r, word);
    if(parsed) return parsed;
  }catch(e){
    console.error('dictionaryapi.dev direto falhou, tentando via proxy CORS:', e);
  }
  // 2ª tentativa: via proxy (contorna CORS instável do provedor)
  try{
    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(directUrl);
    const r2 = await fetch(proxyUrl);
    const parsed2 = await parseDictionaryApiResponse(r2, word);
    if(parsed2) return parsed2;
  }catch(e){
    console.error('dictionaryapi.dev via proxy também falhou (ignorado, usando fallback):', e);
  }
  return null;
}

async function fetchFromDatamuse(word){
  try{
    const r = await fetch('https://api.datamuse.com/words?sp=' + encodeURIComponent(word) + '&md=d&max=1');
    if(!r.ok) return null;
    const data = await r.json();
    const first = data[0];
    if(!first || !first.word || first.word.toLowerCase() !== word.toLowerCase() || !first.defs || !first.defs.length) return null;
    const raw = first.defs[0];
    const definition = raw.includes('\t') ? raw.split('\t')[1] : raw;
    return { definition };
  }catch(e){
    console.error('datamuse failed:', e);
    return null;
  }
}

function pickExampleFromTatoebaJson(data, word){
  const results = (data.results || []).filter(s => s.text && s.text.toLowerCase().includes(word.toLowerCase()));
  if(!results.length) return '';
  // prioriza frases de tamanho médio (nem curtas demais, nem longas demais) para facilitar o aprendizado
  const mid = results.filter(s => s.text.length >= 15 && s.text.length <= 90);
  const pool = mid.length ? mid : results;
  return pool[Math.floor(Math.random() * Math.min(pool.length, 5))].text;
}

async function fetchExampleFromTatoeba(word){
  const directUrl = 'https://tatoeba.org/eng/api_v0/search?from=eng&query=' + encodeURIComponent(word) + '&sort=relevance';
  // Tatoeba não envia cabeçalho CORS de forma confiável para chamadas de navegador,
  // então tentamos direto e, se falhar, via proxy que adiciona CORS.
  try{
    const r = await fetch(directUrl);
    if(r.ok){
      const picked = pickExampleFromTatoebaJson(await r.json(), word);
      if(picked) return picked;
    }
  }catch(e){
    console.error('tatoeba direto falhou, tentando via proxy CORS:', e);
  }
  try{
    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(directUrl);
    const r2 = await fetch(proxyUrl);
    if(r2.ok){
      const picked2 = pickExampleFromTatoebaJson(await r2.json(), word);
      if(picked2) return picked2;
    }
  }catch(e){
    console.error('tatoeba via proxy também falhou:', e);
  }
  return '';
}

async function fetchWord(word){
  const [mw, primary, secondary, realExample] = await Promise.all([
    fetchFromMerriamWebster(word),
    fetchFromDictionaryApi(word),
    fetchFromDatamuse(word),
    fetchExampleFromTatoeba(word)
  ]);
  const definition = (mw && mw.definition) || (primary && primary.definition) || (secondary && secondary.definition) || '';
  if(!definition) throw new Error('DICT_NOT_FOUND');
  const phonetic = (mw && mw.phonetic) || (primary && primary.phonetic) || '';
  const example = (mw && mw.example) || realExample || (primary && primary.example) || `I learned the word "${word}" today.`;
  const usedFallback = !(mw && mw.definition) && !(primary && primary.definition);
  const wordOut = (mw && mw.word) || (primary && primary.word) || word;
  return { word: wordOut, phonetic, definition, example, degraded: usedFallback };
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const raw = input.value.trim();
  if(!raw) return;
  const word = raw.toLowerCase();
  if(words.some(w => w.word.toLowerCase() === word)){
    setStatus('Essa palavra já está no seu caderno.', true);
    return;
  }
  addBtn.disabled = true;
  setStatus('Buscando significado…');
  let info;
  try{
    info = await fetchWord(word);
  }catch(err){
    console.error('fetchWord failed:', err);
    if(err.message === 'DICT_NOT_FOUND'){
      setStatus('Não encontrei essa palavra no dicionário. Confira a grafia.', true);
    }else{
      setStatus('Sem conexão com o dicionário. Tente de novo.', true);
    }
    addBtn.disabled = false;
    return;
  }

  setStatus('Traduzindo…');
  const [ptWord, ptExample] = await Promise.all([translate(info.word), translate(info.example)]);
  const entry = {
    word: info.word,
    phonetic: info.phonetic,
    definition: info.definition,
    example: info.example,
    examplePt: ptExample,
    translation: ptWord,
    date: new Date().toISOString()
  };

  setStatus('Salvando…');
  try{
    await freshToken();
    const r = await fetch(`${DB}/${NODE}.json?auth=${idToken}`, {
      method: 'POST',
      body: JSON.stringify(entry)
    });
    const res = await r.json();
    if(!r.ok || res.error){
      throw new Error(res.error || ('HTTP ' + r.status));
    }
    words.unshift({key: res.name, ...entry});
    render();
    input.value = '';
    setStatus(info.degraded ? 'Adicionado ✓ (definição simplificada — fonte principal indisponível)' : 'Adicionado ✓');
    setTimeout(() => setStatus(''), info.degraded ? 4000 : 2000);
  }catch(err){
    console.error('Firebase save failed:', err);
    setStatus('Não consegui salvar no seu caderno (' + err.message + '). Toque em ↻ atualizar e tente de novo.', true);
  }finally{
    addBtn.disabled = false;
  }
});

async function removeWord(key){
  try{
    await freshToken();
    const r = await fetch(`${DB}/${NODE}/${key}.json?auth=${idToken}`, { method: 'DELETE' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    words = words.filter(w => w.key !== key);
    render();
  }catch(e){
    console.error('removeWord failed:', e);
    setStatus('Não consegui remover (' + e.message + ').', true);
  }
}

async function refetchAndApply(key, wordText){
  const w = words.find(x => x.key === key);
  if(!w) return false;
  try{
    const info = await fetchWord(wordText);
    const ptExample = await translate(info.example);
    const updates = { definition: info.definition, example: info.example, examplePt: ptExample, phonetic: info.phonetic };
    await freshToken();
    const r = await fetch(`${DB}/${NODE}/${key}.json?auth=${idToken}`, {
      method: 'PATCH',
      body: JSON.stringify(updates)
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    Object.assign(w, updates);
    return true;
  }catch(e){
    console.error('refetchAndApply failed for "' + wordText + '":', e);
    return false;
  }
}

async function regenerateExample(key, wordText){
  setStatus('Buscando frase real para "' + wordText + '"…');
  const ok = await refetchAndApply(key, wordText);
  render();
  setStatus(ok ? 'Atualizado ✓' : 'Não consegui atualizar essa palavra.', !ok);
  setTimeout(() => setStatus(''), ok ? 2000 : 4000);
}

async function regenerateAllExamples(){
  if(!words.length) return;
  const total = words.length;
  let okCount = 0;
  for(let i = 0; i < total; i++){
    setStatus(`Atualizando frases… (${i + 1}/${total})`);
    const ok = await refetchAndApply(words[i].key, words[i].word);
    if(ok) okCount++;
    render();
    await new Promise(res => setTimeout(res, 250));
  }
  setStatus(`Concluído: ${okCount}/${total} palavras atualizadas ✓`);
  setTimeout(() => setStatus(''), 5000);
}

function render(){
  document.getElementById('countText').textContent = words.length + (words.length === 1 ? ' palavra aprendida' : ' palavras aprendidas');
  if(words.length === 0){
    listEl.innerHTML = '<div class="empty">Seu caderno está vazio.<br>Adicione a primeira palavra acima.</div>';
    return;
  }
  listEl.innerHTML = words.map(w => `
    <div class="card">
      <div class="row1">
        <span class="word">${escapeHtml(w.word)}</span>
        ${w.phonetic ? `<span class="phonetic">${escapeHtml(w.phonetic)}</span>` : ''}
        <button class="speak" title="Ouvir pronúncia" onclick="speak('${escapeJs(w.word)}')">🔊</button>
      </div>
      <div class="translation">${escapeHtml(w.translation || '—')}</div>
      <div class="definition">${escapeHtml(w.definition)}</div>
      <div class="example">"${escapeHtml(w.example)}"
        ${w.examplePt ? `<span class="pt">${escapeHtml(w.examplePt)}</span>` : ''}
      </div>
      <div class="meta">
        <span>${w.date ? new Date(w.date).toLocaleDateString('pt-BR') : ''}</span>
        <span>
          <button class="del" onclick="regenerateExample('${w.key}', '${escapeJs(w.word)}')">🔄 nova frase</button>
          &nbsp;·&nbsp;
          <button class="del" onclick="removeWord('${w.key}')">remover</button>
        </span>
      </div>
    </div>
  `).join('');
}

function escapeHtml(s){ return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeJs(s){ return String(s || '').replace(/'/g, "\\'"); }
</script>
</body>
</html>
