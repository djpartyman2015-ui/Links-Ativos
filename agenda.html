<style>
  :root{
    --bg:#12171D;
    --panel:#1B222A;
    --panel-alt:#212A33;
    --border:#2C3641;
    --text:#E9ECEF;
    --muted:#8B96A3;
    --accent:#8B7FE8;
    --accent-dim:#332D57;
    --ok:#4FB6A8;
    --ok-dim:#26443F;
    --danger:#D9584C;
    --danger-dim:#4A2A26;
    --gold:#E8B25F;
    --gold-dim:#4A3D24;
    --rose:#E8709A;
    --rose-dim:#4A2A38;
    --grid: rgba(255,255,255,0.035);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent);color:#12171D;}

  header{
    position:relative;
    padding:44px 28px 34px;
    background:
      linear-gradient(180deg, rgba(18,23,29,0) 0%, var(--bg) 92%),
      repeating-linear-gradient(0deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 28px),
      var(--panel);
    border-bottom:1px solid var(--border);
    overflow:hidden;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; letter-spacing:.18em; color:var(--accent); text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow svg{width:16px;height:16px;flex-shrink:0;}
  h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(30px,4.4vw,44px); margin:8px 0 4px; letter-spacing:-.01em;
  }
  header p.sub{color:var(--muted); margin:0 0 26px; font-size:14.5px; max-width:560px;}

  .stats{display:flex; gap:14px; flex-wrap:wrap;}
  .stat{
    background:var(--panel-alt); border:1px solid var(--border); border-radius:10px;
    padding:14px 18px; min-width:150px;
  }
  .stat .n{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; line-height:1.25;}
  .stat .l{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:2px;}
  .stat.accent .n{color:var(--accent);}
  .stat.ok .n{color:var(--ok);}

  main{max-width:980px; margin:0 auto; padding:26px 28px 80px;}

  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px;
  }
  .toolbar input[type=search]{
    flex:1; min-width:180px; background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:10px 13px; border-radius:8px; font-size:14px; font-family:'Inter',sans-serif;
  }
  select{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:8px; font-size:13.5px; font-family:'Inter',sans-serif;
  }
  .btn{
    border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif; transition:opacity .15s;
  }
  .btn:hover{opacity:.88;}
  .btn-primary{background:var(--accent); color:#12171D;}
  .btn-ghost{background:var(--panel-alt); color:var(--text); border:1px solid var(--border);}
  .btn-icon{background:transparent; border:none; color:var(--muted); cursor:pointer; padding:6px; border-radius:6px;}
  .btn-icon:hover{color:var(--text); background:var(--panel-alt);}

  .sync{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%; background:var(--ok);}
  .dot.busy{background:var(--accent); animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.3;}}

  .monthhead{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin:26px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border);
  }
  .monthhead:first-of-type{margin-top:4px;}

  .row{
    display:flex; gap:0; background:var(--panel); border:1px solid var(--border); border-radius:10px;
    margin-bottom:10px; overflow:hidden; transition:border-color .15s;
  }
  .row:hover{border-color:#3A4552;}
  .row.concluido{opacity:.5;}
  .row.cancelado{opacity:.45;}
  .row.andamento{border-color:var(--ok); border-width:1.5px;}

  .flagtag{
    flex-shrink:0; width:54px; display:flex; align-items:center; justify-content:center;
    font-size:19px; position:relative;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 14px 50%);
  }

  .rowbody{flex:1; padding:14px 18px 14px 22px; min-width:0;}
  .rowtop{display:flex; align-items:flex-start; gap:14px;}
  .rowtop > div:first-child{flex:1; min-width:0;}
  .countdown{display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:122px; padding:2px 4px; flex-shrink:0;}
  .countdown .cd-num{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:21px; line-height:1; color:var(--accent); white-space:nowrap;}
  .countdown .cd-clock{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:16px; letter-spacing:.02em; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums;}

function setSync(state, text){
  document.getElementById('syncDot').className = 'dot' + (state==='busy' ? ' busy' : '');
  document.getElementById('syncText').textContent = text;
}

async function load(initial=false){
  setSync('busy','sincronizando...');
  try{
    const res = await fetch(DB_URL);
    const data = await res.json();
    if(!data){
      const obj = {};
      SEED.forEach((s,i)=>{ obj['e'+i+'_'+Date.now()] = s; });
      await fetch(DB_URL, {method:'PUT', body: JSON.stringify(obj)});
      items = obj;
    } else {
      items = data;
    }
    setSync('ok','sincronizado agora');
    render();
  }catch(e){
    setSync('busy','erro de conexão — tentando de novo');
  }
}

async function saveAll(){
  setSync('busy','salvando...');
  try{
    await fetch(DB_URL, {method:'PUT', body: JSON.stringify(items)});
    setSync('ok','salvo');
  }catch(e){
    setSync('busy','erro ao salvar');
  }
}

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function statusOf(e){
  const t = todayISO();
  if(e.cancelado) return 'cancelado';
  if(e.dataFim < t) return 'concluido';
  if(e.dataInicio <= t && t <= e.dataFim) return 'andamento';
  return 'previsto';
}

function diffDays(iso){
  const t = new Date(todayISO()+'T00:00:00');
  const d = new Date(iso+'T00:00:00');
  return Math.round((d-t)/86400000);
}

function fmtShort(iso){
  const p = iso.split('-');
  return parseInt(p[2],10)+' '+MESES_ABR[parseInt(p[1],10)-1];
}

function fmtRange(ini, fim){
  if(ini===fim) return fmtShort(ini);
  const p1 = ini.split('-'), p2 = fim.split('-');
  if(p1[0]===p2[0] && p1[1]===p2[1]) return parseInt(p1[2],10)+' a '+fmtShort(fim);
  return fmtShort(ini)+' – '+fmtShort(fim);
}

function countdownText(e){
  const st = statusOf(e);
  if(st==='cancelado') return 'cancelado';
  if(st==='concluido') return 'concluído';
  if(st==='andamento') return 'rolando agora';
  const dd = diffDays(e.dataInicio);
  if(dd===0) return 'hoje';
  if(dd===1) return 'amanhã';
  if(dd<7) return 'em '+dd+' dias';
  if(dd<30){ const w=Math.round(dd/7); return 'em '+w+' semana'+(w>1?'s':''); }
  if(dd<365){ const mo=Math.round(dd/30); return 'em '+mo+' mês'+(mo>1?'es':''); }
  const yr=Math.round(dd/365); return 'em '+yr+' ano'+(yr>1?'s':'');
}

function pad2(n){ return String(n).padStart(2,'0'); }

function formatClock(diffMs){
  const totalSec = Math.max(0, Math.floor(diffMs/1000));
  const days = Math.floor(totalSec/86400);
  const hours = Math.floor((totalSec%86400)/3600);
  const mins = Math.floor((totalSec%3600)/60);
  const secs = totalSec%60;
  return days+':'+pad2(hours)+':'+pad2(mins)+':'+pad2(secs);
}

function countdownBadge(e){
  const st = statusOf(e);
  if(st==='andamento') return '<div class="countdown now"><div class="cd-num">●</div><div class="cd-label">agora</div></div>';
  if(st!=='previsto') return '';
  const timePart = e.horaInicio ? e.horaInicio+':00' : '00:00:00';
  const target = new Date(e.dataInicio+'T'+timePart).getTime();
  const diff = target - Date.now();
  if(diff<=0) return '<div class="countdown today"><div class="cd-num">HOJE</div><div class="cd-label">chegou</div></div>';
  return '<div class="countdown"><div class="cd-clock" data-target="'+target+'">'+formatClock(diff)+'</div><div class="cd-label">dias:hrs:min:seg</div></div>';
}

function tickClocks(){
  document.querySelectorAll('.cd-clock[data-target]').forEach(el=>{
    const target = parseInt(el.dataset.target,10);
    const diff = target - Date.now();
    if(diff<=0){ render(); return; }
    el.textContent = formatClock(diff);
  });
}

function monthKey(iso){ return iso.slice(0,7); }
function monthLabel(key){
  const p = key.split('-');
  return MESES_LONG[parseInt(p[1],10)-1]+' de '+p[0];
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const list = document.getElementById('list');
  const q = document.getElementById('search').value.toLowerCase().trim();
  const catF = document.getElementById('filterCat').value;
  const statusF = document.getElementById('filterStatus').value;
  const t = todayISO();

  let arr = Object.entries(items).map(([id,v])=>({id,...v}));

  const previstos = arr.filter(e=>{const s=statusOf(e); return s==='previsto'||s==='andamento';});
  const esteMes = previstos.filter(e=>monthKey(e.dataInicio)===monthKey(t));
  const historico = arr.filter(e=>statusOf(e)==='concluido');
  const proximo = previstos.slice().sort((a,b)=>a.dataInicio.localeCompare(b.dataInicio))[0];

  document.getElementById('statProximo').textContent = proximo ? proximo.titulo : '—';
  document.getElementById('statPrevistos').textContent = previstos.length;
  document.getElementById('statMes').textContent = esteMes.length;
  document.getElementById('statHistorico').textContent = historico.length;

  if(q) arr = arr.filter(e => (e.titulo||'').toLowerCase().includes(q) || (e.notas||'').toLowerCase().includes(q));
  if(catF!=='todas') arr = arr.filter(e=>e.categoria===catF);

  let sortAsc = true;
  if(statusF==='proximos'){
    arr = arr.filter(e=>{const s=statusOf(e); return s==='previsto'||s==='andamento';});
    sortAsc = true;
  } else if(statusF==='historico'){
    arr = arr.filter(e=>{const s=statusOf(e); return s==='concluido'||s==='cancelado';});
    sortAsc = false;
  } else {
    sortAsc = false;
  }

  arr.sort((a,b)=> sortAsc ? a.dataInicio.localeCompare(b.dataInicio) : b.dataInicio.localeCompare(a.dataInicio));

  if(arr.length===0){
    list.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/></svg>
      <div>Nada por aqui. Clique em "+ Novo evento" para começar.</div>
    </div>`;
    return;
  }

  let html = '';
  let lastMonth = null;
  arr.forEach(e=>{
    const mk = monthKey(e.dataInicio);
    if(mk !== lastMonth){
      html += `<div class="monthhead">${monthLabel(mk)}</div>`;
      lastMonth = mk;
    }
    const cat = CATS[e.categoria] || CATS.evento;
    const st = statusOf(e);
    const cd = countdownText(e);
    let pillClass = st;
    if(st==='previsto' && (cd==='hoje' || cd==='amanhã')) pillClass = 'hoje';
    html += `
    <div class="row ${st}">
      <div class="flagtag" style="background:${cat.dim};color:${cat.color};">${cat.icon}</div>
      <div class="rowbody">
        <div class="rowtop">
          <div>
            <div class="titulo">${escapeHtml(e.titulo)}</div>
            <div class="meta">
              <span class="data">${fmtRange(e.dataInicio, e.dataFim)}${e.horaInicio ? " · "+e.horaInicio : ''}</span>
              <span class="pill ${pillClass}">${cd}</span>
              <span class="cattag">${cat.label}</span>
            </div>
          </div>
          ${countdownBadge(e)}
          <div class="actions">
            ${e.notas ? `<button class="btn-icon" onclick="toggleNotas('${e.id}')" title="Ver notas"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>` : ''}
            <button class="btn-icon" onclick="openEdit('${e.id}')" title="Editar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          </div>
        </div>
        ${e.notas ? `<div class="notas" id="notas_${e.id}">${escapeHtml(e.notas)}</div>` : ''}
      </div>
    </div>`;
  });
  list.innerHTML = html;
}

function toggleNotas(id){
  document.getElementById('notas_'+id).classList.toggle('open');
}

function openAdd(){
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Novo evento';
  document.getElementById('fTitulo').value='';
  const t = todayISO();
  document.getElementById('fInicio').value = t;
  document.getElementById('fFim').value = t;
  document.getElementById('fHora').value = '';
  document.getElementById('fCategoria').value = 'evento';
  document.getElementById('fCancelado').checked = false;
  document.getElementById('fNotas').value = '';
  document.getElementById('fEditor').value = localStorage.getItem('agenda133_editor')||'';
  document.getElementById('btnDelete').style.display='none';
  document.getElementById('overlay').classList.add('open');
}

function openEdit(id){
  editingId = id;
  const e = items[id];
  document.getElementById('modalTitle').textContent = 'Editar evento';
  document.getElementById('fTitulo').value = e.titulo||'';
  document.getElementById('fInicio').value = e.dataInicio||todayISO();
  document.getElementById('fFim').value = e.dataFim||e.dataInicio||todayISO();
  document.getElementById('fHora').value = e.horaInicio||'';
  document.getElementById('fCategoria').value = e.categoria||'evento';
  document.getElementById('fCancelado').checked = !!e.cancelado;
  document.getElementById('fNotas').value = e.notas||'';
  document.getElementById('fEditor').value = localStorage.getItem('agenda133_editor')||'';
  document.getElementById('btnDelete').style.display='inline-block';
  document.getElementById('overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
}

async function save(){
  const editor = document.getElementById('fEditor').value.trim();
  if(editor) localStorage.setItem('agenda133_editor', editor);

  const titulo = document.getElementById('fTitulo').value.trim();
  if(!titulo){ alert('Digite o título do evento.'); return; }

  let inicio = document.getElementById('fInicio').value;
  let fim = document.getElementById('fFim').value || inicio;
  if(!inicio){ alert('Escolha a data de início.'); return; }
  if(fim < inicio) fim = inicio;

  const obj = {
    titulo,
    dataInicio: inicio,
    dataFim: fim,
    horaInicio: document.getElementById('fHora').value || '',
    categoria: document.getElementById('fCategoria').value,
    cancelado: document.getElementById('fCancelado').checked,
    notas: document.getElementById('fNotas').value.trim(),
    editor,
    updatedAt: Date.now()
  };

  const id = editingId || ('e_' + Date.now());
  items[id] = obj;
  closeModal();
  render();
  await saveAll();
}

async function del(){
  if(!editingId) return;
  if(!confirm('Excluir este evento da agenda?')) return;
  delete items[editingId];
  closeModal();
  render();
  await saveAll();
}

document.getElementById('btnAdd').onclick = openAdd;
document.getElementById('btnCancel').onclick = closeModal;
document.getElementById('btnSave').onclick = save;
document.getElementById('btnDelete').onclick = del;
document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };

  const fFim = document.getElementById('fFim');
  if(!fFim.value || fFim.value < this.value) fFim.value = this.value;
};
